<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAADNotifier - Próximamente en Google Play</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333333;
            line-height: 1.6;
            padding: 40px 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            max-width: 520px;
            width: 100%;
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #bfdbfe;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 2.2rem;
            color: #111827;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .subtitle {
            font-size: 1rem;
            color: #4b5563;
            margin-bottom: 28px;
        }
        .store-badge {
            display: inline-block;
            margin-bottom: 8px;
        }
        .store-badge img {
            height: 56px;
            transition: transform 0.2s ease;
        }
        .store-badge img:hover {
            transform: scale(1.05);
        }
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Próximamente</span>
        <h1>SAADNotifier</h1>
        <p class="subtitle">Notificaciones y seguimiento de vacantes docentes en tiempo real.</p>
        
        <div class="store-badge">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Disponible en Google Play">
        </div>

        <div class="footer">
            <p>&copy; SAADNotifier &bull; <a href="privacidad.html">Política de Privacidad</a></p>
        </div>
    </div>

</body>
</html>
